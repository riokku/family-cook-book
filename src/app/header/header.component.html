<header class="shop-front">
  <!-- The shop's awning: stripes and a scalloped edge, purely decoration. -->
  <div class="awning" aria-hidden="true">
    <div class="awning-stripes"></div>
    <div class="awning-scallops"></div>
  </div>

  <nav class="navbar navbar-expand-lg" aria-label="Main">
    <div class="container shop-bar">
      <!-- The logo is the shop sign hanging under the awning. The name on it is
           real text inside the h1, so screen readers and the document outline
           get the full site name rather than an image of it. -->
      <a routerLink="/" class="shop-sign">
        <span class="sign-chains" aria-hidden="true"></span>
        <span class="sign-board">
          <!-- The same mark as the footer: a mixing bowl with a whisk in it and
               a heart rising off the top, in a ring. -->
          <svg class="sign-icon" aria-hidden="true" focusable="false" width="42" height="42" viewBox="0 0 48 48"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="22"></circle>
            <path d="M26 25 35 12"></path>
            <path d="M12 25h24a12 12 0 0 1-24 0z" fill="currentColor"></path>
            <path d="M19 21c-2.700-1.900-4.200-3.400-4.200-5.100a2.200 2.200 0 0 1 4.200-.900 2.200 2.200 0 0 1 4.200.900c0 1.700-1.500 3.200-4.200 5.100z" fill="currentColor" stroke="none"></path>
            <path d="M19 40h10"></path>
          </svg>
          <span class="sign-text">
            <h1 class="site-title">Gogo&rsquo;s Kitchen</h1>
            <span class="sign-tagline">Family recipes for you</span>
          </span>
        </span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul id="navbarUl" class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="closeNavOnClick()">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/recipes" routerLinkActive="active-link" (click)="closeNavOnClick()">Recipes</a>
          </li>
          @if (userIsAdmin) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/admin" routerLinkActive="active-link" (click)="closeNavOnClick()">Admin</a>
            </li>
          }
          @if (userIsAdmin) {
            <li class="nav-item">
              <button class="nav-logout-btn" (click)="onLogout()" title="Log out" aria-label="Log out">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
              </button>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</header>
