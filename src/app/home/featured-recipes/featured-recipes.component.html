<!-- The glass display case: every featured recipe on a plate on a wooden
     shelf, each with a little tent card saying what it is. -->
@if (featuredRecipes.length) {
  <section class="case-band" aria-labelledby="featured-heading">
    <div class="case-inner">
      <div class="case-head">
        <h2 class="case-heading" id="featured-heading">In the case today</h2>
        <a class="see-all" routerLink="/recipes">See all recipes</a>
      </div>

      <div class="case">
        <ul class="shelves">
          @for (recipe of featuredRecipes; track recipe.slug; let i = $index) {
            <li class="shelf-slot">
              <a class="case-item" [routerLink]="['/recipes', recipe.slug]" [appRevealOnScroll]="(i % 3) * 80">
                <app-recipe-photo class="plate" [recipe]="recipe" [lazy]="i > 2" sizes="168px"></app-recipe-photo>
                <span class="tent-card">
                  @if (recipe.tags?.length) {
                    <span class="tent-kicker">{{ recipe.tags[0] }}</span>
                  }
                  <span class="tent-name">{{ recipe.name }}</span>
                  <span class="tent-meta">
                    {{ recipe.total_time | timeFormat }} &middot; {{ recipe.serving_size }} servings
                  </span>
                </span>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>
  </section>
}
