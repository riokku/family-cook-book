<div class="home-wrapper pt-5 pb-5">
  <section class="hero">
    <div class="container">
      <div class="row align-items-start g-4">
        <div class="col-12 col-lg-7">
          <h1 class="fw-bold mb-3">
            Welcome to Gogo&rsquo;s Kitchen!
          </h1>
          <p class="tagline mb-4">
            Where every meal is a celebration of family, love, and good food.
          </p>

          <ul class="stat-list mb-4" *ngIf="recipes.length">
            <li *ngFor="let stat of stats">
              <span class="stat-value">{{ stat.display }}</span>
              <span class="stat-label">{{ stat.label }}</span>
            </li>
          </ul>

          <div class="cta-row">
            <a routerLink="/recipes" class="cta cta-primary">
              <i class="bi bi-search-heart" aria-hidden="true"></i> Explore recipes
            </a>
            <button type="button" class="cta cta-secondary" (click)="surpriseMe()"
              [disabled]="!recipes.length">
              <i class="bi bi-shuffle" aria-hidden="true"></i> Surprise me
            </button>
          </div>

          <div class="category-links mt-5" *ngIf="categories.length">
            <h2 class="section-heading mb-3" id="browse-heading">
              Browse by category
            </h2>
            <ul class="category-list" aria-labelledby="browse-heading">
              <li *ngFor="let category of categories; let i = index" [appRevealOnScroll]="i * 40">
                <a [routerLink]="['/recipes']" [queryParams]="{ category: category }">
                  <img [src]="'../../assets/icons/categories/' + category + '.png'" alt="" aria-hidden="true">
                  {{ category }}
                </a>
              </li>
            </ul>
          </div>
        </div>

        <div class="col-12 col-lg-5">
          <app-featured-recipes></app-featured-recipes>
        </div>
      </div>
    </div>
  </section>
</div>
