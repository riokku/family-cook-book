<!-- Purely decorative: hidden from assistive tech, and any key or tap skips it.
     The real page title lives in the header's h1, so the monogram here is only
     the same two letters made large. -->
<div class="wrapper" aria-hidden="true">
  <div class="badge">
    <p class="monogram">GK</p>
  </div>

  <!-- In front of the badge rather than behind it: the letters are solid and
       the sprinkles are thin, so depth costs nothing in legibility. -->
  <div class="sprinkles">
    @for (sprinkle of sprinkles; track $index) {
      <span class="sprinkle" [ngClass]="sprinkle.variant" [ngStyle]="sprinkle.styles"></span>
    }
  </div>
</div>
