<!-- Purely decorative: hidden from assistive tech, and any key or tap skips it. -->
<div class="wrapper" aria-hidden="true">
  <div class="content">
    <svg
      class="cupcake"
      viewBox="0 0 200 162"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- Cupcake outline draws in: frosting dome + wrapper -->
      <path
        class="cupcake-outline"
        d="M 82,157 L 66,122 C 63,112 70,107 80,107 C 83,107 85,102 87,97 C 89,92 91,87 94,83 C 96,79 98,74 100,68 C 102,74 104,79 106,83 C 109,87 111,92 113,97 C 115,102 117,107 120,107 C 130,107 137,112 134,122 L 118,157 Z"
        pathLength="100"
      />
      <!-- Sprinkles: rounded rods, pop in staggered. Capsules rather than the
           ellipses these started as — an ellipse narrows to a point at each
           end and reads as rice, where a sprinkle holds its width to the cap.
           rx is half the short side either way round, so both the upright and
           the lying-down ones come out as stadiums. -->
      <rect class="sprinkle" x="93"  y="75"  width="4"  height="10" rx="2" style="fill: #ff6b81;" />
      <rect class="sprinkle" x="103" y="83"  width="10" height="4"  rx="2" style="fill: #ffd32a;" />
      <rect class="sprinkle" x="85"  y="91"  width="4"  height="10" rx="2" style="fill: #00d2d3;" />
      <rect class="sprinkle" x="109" y="93"  width="10" height="4"  rx="2" style="fill: #ff6348;" />
      <rect class="sprinkle" x="99"  y="88"  width="4"  height="10" rx="2" style="fill: #1dd1a1;" />
      <rect class="sprinkle" x="85"  y="102" width="10" height="4"  rx="2" style="fill: #a29bfe;" />
      <rect class="sprinkle" x="111" y="101" width="4"  height="10" rx="2" style="fill: #fd79a8;" />
    </svg>

    <!-- Title curved along a smile arc -->
    <svg
      class="site-name-svg"
      viewBox="0 -10 380 70"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <path id="smile-arc" d="M 5,55 A 185,25 0 0,0 375,55" />
      </defs>
      <text class="site-name">
        <textPath href="#smile-arc" startOffset="50%" text-anchor="middle">Gogo&rsquo;s Kitchen</textPath>
      </text>
    </svg>
  </div>
</div>
