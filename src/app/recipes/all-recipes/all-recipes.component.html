<section class="all-recipes-wrapper">
  <div class="container pt-5 pb-5">
    <div class="row">
      <div class="col-12">
        <div class="banner">
          <h1>
            Find a recipe
          </h1>
          <p class="result-count" *ngIf="resultCount">
            {{ resultCount }}
          </p>
        </div>
        <div class="search-filter-wrapper">

          <div class="toolbar">
            <div class="search-wrapper" role="search">
              <label class="visually-hidden" for="recipe-search">
                Search recipes
              </label>
              <div class="search-input-wrapper">
                <i class="bi bi-search search-icon" aria-hidden="true"></i>
                <input id="recipe-search" type="search" [(ngModel)]="searchInput" (input)="applyFilters()"
                  placeholder="Search name, ingredient, tag...">
                <button class="clear-search" type="button" (click)="clearSearchInput()" *ngIf="searchInput"
                  aria-label="Clear search">
                  <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <label class="visually-hidden" for="recipe-sort">
              Sort recipes
            </label>
            <select class="sort-select" id="recipe-sort" [(ngModel)]="sortOption" (ngModelChange)="applyFilters()">
              <option *ngFor="let option of sortOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>

            <button class="filter-toggle" type="button" (click)="showFilters()"
              [class.has-selection]="selectedCategories.length"
              [attr.aria-expanded]="filtersShowing" aria-controls="category-filter-panel">
              <i class="bi bi-sliders" aria-hidden="true"></i>
              Categories
              <span class="count-badge" *ngIf="selectedCategories.length" aria-hidden="true">
                {{ selectedCategories.length }}
              </span>
              <i class="bi" [ngClass]="filtersShowing ? 'bi-chevron-up' : 'bi-chevron-down'" aria-hidden="true"></i>
            </button>
          </div>

          <div class="filter-options" id="category-filter-panel" role="group" aria-label="Filter by category"
            [hidden]="!filtersShowing">
            <button class="filter-option" type="button" *ngFor="let category of recipeCategories"
              (click)="toggleCategory(category)"
              [class.active]="isCategorySelected(category)"
              [attr.aria-pressed]="isCategorySelected(category)">
              <i class="bi bi-check-lg check-icon" aria-hidden="true" *ngIf="isCategorySelected(category)"></i>
              <img [src]="'../../../assets/icons/categories/' + category + '.png'" alt="" aria-hidden="true">
              {{ category }}
            </button>
          </div>

          <div class="panel-footer" *ngIf="hasActiveFilters || hasActiveSort">
            <ul class="chip-list" aria-label="Active filters">
              <li *ngFor="let category of selectedCategories">
                <button class="chip" type="button" (click)="toggleCategory(category)"
                  [attr.aria-label]="'Remove ' + category + ' filter'">
                  {{ category }}
                  <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
              </li>
              <li *ngIf="searchInput.trim()">
                <button class="chip" type="button" (click)="clearSearchInput()"
                  [attr.aria-label]="'Clear search for ' + searchInput.trim()">
                  &ldquo;{{ searchInput.trim() }}&rdquo;
                  <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
              </li>
            </ul>
            <button class="clear-all" type="button" (click)="clearAll()">
              <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Clear all
            </button>
          </div>

        </div>

        <p class="visually-hidden" role="status" aria-live="polite">
          {{ liveSummary }}
        </p>
      </div>
    </div>

    <div class="row recipe-grid">
      <ng-container *ngIf="isLoading">
        <div class="col-12 col-sm-12 col-md-6 col-xl-4 d-flex mb-4" *ngFor="let placeholder of skeletonCards">
          <div class="skeleton-card" aria-hidden="true">
            <div class="skeleton-image"></div>
            <div class="skeleton-body">
              <div class="skeleton-line title"></div>
              <div class="skeleton-line meta"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line short"></div>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="!isLoading">
        <ng-container *ngIf="selectedRecipes.length; else noResults">
          <div class="col-12 col-sm-12 col-md-6 col-xl-4 d-flex mb-4" *ngFor="let recipe of selectedRecipes; let i = index">
            <app-recipe-card [recipe]="recipe" [index]="i" [activeTags]="selectedCategories"
              (tagSelected)="toggleCategory($event)"></app-recipe-card>
          </div>
        </ng-container>
        <ng-template #noResults>
          <div class="col-12">
            <div class="empty-state">
              <i class="bi bi-search" aria-hidden="true"></i>
              <p class="empty-state-title">
                No recipes match your filters
              </p>
              <p class="empty-state-hint">
                Try a different search term, or widen your search by removing a category.
              </p>
              <button class="clear-all" type="button" (click)="clearAll()" *ngIf="hasActiveFilters">
                <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Clear all filters
              </button>
            </div>
          </div>
        </ng-template>
      </ng-container>
    </div>
  </div>
</section>
