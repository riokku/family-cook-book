@if (related.length) {
  <section class="related" aria-labelledby="related-heading">
    <h2 class="related-heading" id="related-heading">
      More like this
    </h2>
    <div class="related-grid">
      @for (match of related; track match.slug) {
        <div class="grid-cell">
          <app-recipe-card [recipe]="match" [index]="$index" [tagsLinkToFilter]="true"></app-recipe-card>
        </div>
      }
    </div>
  </section>
}
